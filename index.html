<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090a0d">
    <meta
      name="description"
      content="A reliable, distraction-free dashboard for independent interval timers."
    >
    <title>Interval Timers</title>
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/storage.js"></script>
    <script defer src="js/timer.js"></script>
    <script defer src="js/audio.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div class="app-sticky">
        <header class="app-header">
          <div class="brand">
            <p class="eyebrow">Focus utility</p>
            <h1>Timers</h1>
          </div>

          <div class="header-actions">
            <details id="globalSoundControl" class="sound-menu">
              <summary class="header-button">
                <span class="header-button__icon" aria-hidden="true">&#9835;</span>
                <span id="soundEnabledLabel">Sound on</span>
              </summary>

              <div class="sound-menu__panel">
                <div class="sound-menu__heading">
                  <div>
                    <h2>Sound</h2>
                    <p>Applies to every timer.</p>
                  </div>
                  <label class="switch-control">
                    <span class="visually-hidden">Sound enabled</span>
                    <input id="soundEnabledInput" type="checkbox">
                    <span class="switch" aria-hidden="true"></span>
                    <span id="soundSwitchLabel">On</span>
                  </label>
                </div>

                <label class="field field--range" for="volumeInput">
                  <span>Volume</span>
                  <span class="range-control">
                    <input id="volumeInput" type="range" min="0" max="100" step="1">
                    <output id="volumeValue" for="volumeInput">100%</output>
                  </span>
                </label>

                <button id="restoreDefaultsButton" class="button button--quiet" type="button">
                  Restore defaults
                </button>
                <p
                  id="globalFeedback"
                  class="control-feedback"
                  role="status"
                  aria-live="polite"
                  aria-atomic="true"
                ></p>
              </div>
            </details>

            <button id="addTimerButton" class="button button--primary add-timer-button" type="button">
              <span aria-hidden="true">+</span>
              <span>Add timer</span>
            </button>
          </div>
        </header>
      </div>

      <main class="timer-workspace">
        <ul id="timerStack" class="timer-stack" aria-label="Independent timers"></ul>

        <section id="timersEmpty" class="timers-empty" aria-labelledby="timersEmptyTitle" hidden>
          <span class="timers-empty__icon" aria-hidden="true">+</span>
          <h2 id="timersEmptyTitle">No timers yet</h2>
          <p>Add a timer, give it a color, and run it independently.</p>
        </section>

      </main>
    </div>

    <aside id="timerHud" class="timer-hud" aria-label="Floating timer overview">
      <header class="timer-hud__dragbar">
        <div
          id="hudDragHandle"
          class="timer-hud__drag-target"
          role="button"
          tabindex="0"
          aria-label="Move timer overview"
        >
          <span class="timer-hud__grip" aria-hidden="true">&#8942;&#8942;</span>
          <span>Timer overview</span>
        </div>
        <div class="timer-hud__size-controls" role="group" aria-label="Overview size">
          <button id="hudDefaultSize" class="timer-hud__default-size" type="button">
            Default size
          </button>
          <button id="hudSizeDown" class="timer-hud__size-step" type="button" aria-label="Make overview smaller">
            &minus;
          </button>
          <button id="hudSizeUp" class="timer-hud__size-step" type="button" aria-label="Make overview larger">
            +
          </button>
        </div>
      </header>

      <section id="alertTray" class="hud-alert" data-color="red" hidden>
        <button
          id="hudAlertDismiss"
          class="hud-alert__dismiss"
          type="button"
          aria-label="Dismiss timer alert"
        >
          &times;
        </button>
        <p id="hudAlertKicker" class="hud-alert__kicker">Timer alert</p>
        <h2 id="hudAlertTitle" class="hud-alert__title">Timer ready</h2>
        <p id="alertTrayMessage" class="hud-alert__message" hidden></p>
        <button id="hudAlertReset" class="button button--hud" type="button" hidden>
          Reset timer
        </button>
      </section>

      <ul id="hudTimerList" class="timer-hud__list" aria-label="Timer countdown summary"></ul>
      <p id="hudEmpty" class="timer-hud__empty" hidden>No timers running.</p>
      <button
        id="hudShowStopped"
        class="timer-hud__stopped-toggle"
        type="button"
        aria-expanded="false"
      >
        <span id="hudStoppedLabel">Show stopped</span>
        <span class="timer-hud__chevron" aria-hidden="true"></span>
      </button>
    </aside>

    <template id="timerCardTemplate">
      <li
        class="timer-card-item"
        data-role="card"
        data-state="idle"
        data-color="red"
        data-alerting="false"
      >
        <article class="timer-card" data-role="shell">
          <header class="timer-card__header">
            <div class="timer-identity">
              <span class="timer-color-dot" data-role="color-dot" aria-hidden="true"></span>
              <div class="timer-identity__text">
                <h2 data-role="title">Timer</h2>
                <span class="timer-state" data-role="state">Stopped</span>
              </div>
            </div>

            <div class="timer-card__header-actions">
              <button
                class="icon-button"
                data-role="settings-toggle"
                type="button"
                aria-expanded="false"
              >
                <span aria-hidden="true">&#9881;</span>
                <span class="visually-hidden">Open timer settings</span>
              </button>
            </div>
          </header>

          <div class="timer-card__display">
            <p class="timer-label" data-role="countdown-label">Next alert in</p>
            <div class="countdown" data-role="countdown" role="timer" aria-live="off">1:02</div>

            <div class="progress-summary">
              <span data-role="progress-text">0 of 29 alerts</span>
              <span data-role="progress-percent">0%</span>
            </div>
            <div
              class="progress-track"
              data-role="progress-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="29"
              aria-valuenow="0"
            >
              <div class="progress-fill" data-role="progress-fill"></div>
            </div>

            <p class="timer-status" data-role="status" hidden></p>
          </div>

          <div class="timer-actions">
            <button class="button button--primary" data-role="start" type="button">Start</button>
            <button class="button button--accent" data-role="alert-now" type="button" disabled>
              Alert now
            </button>
            <button class="button button--quiet" data-role="reset" type="button">Reset</button>
          </div>

          <dialog class="timer-settings" data-role="settings-panel">
            <div class="timer-settings__heading">
              <div>
                <p class="eyebrow">Timer preferences</p>
                <h3>Settings</h3>
              </div>
              <div class="timer-settings__heading-actions">
                <p>Changes save automatically.</p>
                <button
                  class="icon-button"
                  data-role="settings-close"
                  type="button"
                  aria-label="Close timer settings"
                >
                  &times;
                </button>
              </div>
            </div>

            <div class="settings-grid">
              <label class="field field--wide">
                <span>Name</span>
                <input data-role="name" type="text" maxlength="60" autocomplete="off">
              </label>

              <fieldset class="field duration-field">
                <legend>Interval</legend>
                <div class="duration-inputs">
                  <label class="duration-part">
                    <span class="visually-hidden">Interval minutes</span>
                    <span class="input-with-unit">
                      <input
                        data-role="minutes"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        role="spinbutton"
                        aria-valuemin="0"
                        aria-valuemax="1440"
                      >
                      <span aria-hidden="true">min</span>
                    </span>
                  </label>
                  <label class="duration-part">
                    <span class="visually-hidden">Interval seconds</span>
                    <span class="input-with-unit">
                      <input
                        data-role="seconds"
                        type="text"
                        inputmode="decimal"
                        role="spinbutton"
                        aria-valuemin="0"
                        aria-valuemax="59.9"
                      >
                      <span aria-hidden="true">sec</span>
                    </span>
                  </label>
                </div>
              </fieldset>

              <label class="field">
                <span>Repeats</span>
                <select data-role="repeat-mode">
                  <option value="finite">Number of alerts</option>
                  <option value="infinite">Until stopped</option>
                </select>
              </label>

              <label class="field" data-role="total-alerts-field">
                <span>Number of alerts</span>
                <input
                  data-role="total-alerts"
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  role="spinbutton"
                  aria-valuemin="1"
                  aria-valuemax="9999"
                >
              </label>

              <div class="field">
                <span>Alert sound</span>
                <span class="select-with-action">
                  <select data-role="sound" aria-label="Alert sound">
                    <option value="glass-ping">Glass Ping</option>
                    <option value="bright-bell">Bright Bell</option>
                    <option value="soft-chime">Soft Chime</option>
                    <option value="double-tap">Low Double Tap</option>
                    <option value="signal-drop">Signal Drop</option>
                    <option value="wood-block">Wood Block</option>
                  </select>
                  <button class="mini-button" data-role="test-sound" type="button">Test</button>
                </span>
              </div>

              <label class="field">
                <span>Visual alert duration</span>
                <span class="input-with-unit">
                  <input
                    data-role="alert-duration"
                    type="text"
                    inputmode="decimal"
                    role="spinbutton"
                    aria-valuemin="0.5"
                    aria-valuemax="15"
                  >
                  <span aria-hidden="true">sec</span>
                </span>
              </label>

              <fieldset class="field field--wide color-field">
                <legend>Timer color</legend>
                <div class="color-options">
                  <label class="color-option color-option--red">
                    <input data-role="color" type="radio" value="red">
                    <span aria-hidden="true"></span>
                    <span class="visually-hidden">Red</span>
                  </label>
                  <label class="color-option color-option--amber">
                    <input data-role="color" type="radio" value="amber">
                    <span aria-hidden="true"></span>
                    <span class="visually-hidden">Amber</span>
                  </label>
                  <label class="color-option color-option--cyan">
                    <input data-role="color" type="radio" value="cyan">
                    <span aria-hidden="true"></span>
                    <span class="visually-hidden">Cyan</span>
                  </label>
                  <label class="color-option color-option--blue">
                    <input data-role="color" type="radio" value="blue">
                    <span aria-hidden="true"></span>
                    <span class="visually-hidden">Blue</span>
                  </label>
                  <label class="color-option color-option--violet">
                    <input data-role="color" type="radio" value="violet">
                    <span aria-hidden="true"></span>
                    <span class="visually-hidden">Violet</span>
                  </label>
                  <label class="color-option color-option--green">
                    <input data-role="color" type="radio" value="green">
                    <span aria-hidden="true"></span>
                    <span class="visually-hidden">Green</span>
                  </label>
                  <label class="color-option color-option--pink">
                    <input data-role="color" type="radio" value="pink">
                    <span aria-hidden="true"></span>
                    <span class="visually-hidden">Pink</span>
                  </label>
                </div>
              </fieldset>

              <label class="check-control field--wide">
                <input data-role="persistent-completion" type="checkbox" checked>
                <span>
                  <strong>Keep completion color</strong>
                  <small>Keep the page tinted until this timer is Reset.</small>
                </span>
              </label>
            </div>

            <div class="timer-settings__footer">
              <button class="button button--danger" data-role="remove" type="button">
                Remove timer
              </button>
              <button class="button button--primary" data-role="settings-done" type="button">
                Done
              </button>
              <p
                class="control-feedback"
                data-role="feedback"
                role="status"
                aria-live="polite"
                aria-atomic="true"
              ></p>
            </div>
          </dialog>
        </article>
      </li>
    </template>

    <div
      id="liveAnnouncements"
      class="visually-hidden"
      aria-live="assertive"
      aria-atomic="true"
    ></div>

    <noscript>
      <p class="noscript-message">These timers need JavaScript enabled to run.</p>
    </noscript>
  </body>
</html>
